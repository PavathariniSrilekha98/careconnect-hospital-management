server.port=8080
spring.application.name=hospital-queue-management

# MongoDB Configuration
# Supports local MongoDB, MongoDB Atlas URI via environment variable SPRING_DATA_MONGODB_URI,
# or auto-in-memory embedded fallback if MongoDB is not reachable.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/hospital_queue_db}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=9a6747f3b97b91079e05e820fb461547365be1e2914eaf1b692865485e0a671239847129837192837198273918273918273
app.jwt.expiration-ms=86400000

# Hospital Queue Settings
app.queue.default-consultation-minutes=10
app.queue.emergency-boost-weight=100
app.queue.senior-boost-weight=50

# WebSocket Broker Path
app.websocket.endpoint=/ws-hospital
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging
logging.level.com.hospital.queue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
