services:
  # 1. Spring Boot Backend API Web Service
  - type: web
    name: careconnect-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/display/live

  # 2. React Frontend Static Site
  - type: web
    name: careconnect-frontend
    env: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
